
name: 無名輪迴｜APK 編譯與網頁發布

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NamelessCycle_Android_Project.zip'
      - 'NamelessCycle_iOS_Website.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  android:
    name: 編譯 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 安裝 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安裝 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解壓縮 Android 專案
        run: |
          mkdir -p android
          unzip -oq NamelessCycle_Android_Project.zip -d android

      - name: 編譯 APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessCycle-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  website:
    name: 部署 iPhone 網頁版
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: nameless-pages
      cancel-in-progress: true

    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 解壓縮網頁專案
        run: |
          mkdir -p site
          unzip -oq NamelessCycle_iOS_Website.zip -d site
          test -f site/index.html

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網頁
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 正式發布網站
        id: deployment
        uses: actions/deploy-pages@v4
