
name: 無名輪迴｜編譯 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NamelessCycle_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: 編譯 APK
    runs-on: ubuntu-latest

    steps:
      - name: 取得遊戲專案
        uses: actions/checkout@v4

      - name: 安裝 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安裝 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 解壓縮 Android 專案
        run: |
          mkdir -p android
          unzip -oq NamelessCycle_Android_Project.zip -d android
          test -f android/app/build.gradle

      - name: 設定 Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: 編譯 APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessCycle-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
